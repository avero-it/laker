# laker-agent configuration. ${VAR} in any value is read from the environment.
# The agent runs near the data (your computer, the NAS, the office network) and
# sends it to laker serve, which must approve it first: start the agent, read
# its ID, then `laker agents approve <id>` (or the Agents page of laker).
schemaversion: 1

agent:
  name: home                     # how laker shows this agent
  server: https://laker.example.com
  timezone: Europe/Rome
  # the agent key (its identity: keep it), checkpoints, scratch files
  datadir: /var/lib/laker-agent
  log:
    verbose: false
    use: console                 # console | betterstack | stdout-json
    betterstack:
      sourcetoken: ""
      ingestinghost: ""
  defaults:
    timeout: 2h
    commitevery: 200

# Adapter names are source names in the lake: unique across laker and all its
# agents (laker refuses a name another agent already writes).
adapters: []
