# Laker configuration. ${VAR} in any value is read from the environment.
# laker serve reads no source itself: mailboxes, files and databases are read by
# laker-agent next to the data (on this machine too), which sends them to the
# web listener below. See `laker-agent config generate`.
schemaversion: 4

common:
  id:
    name: laker
  timezone: Europe/Rome
  # derived data, rebuildable from the lake: local state and search index
  datadir: /var/lib/laker

  log:
    verbose: false
    use: console                 # console | betterstack | stdout-json
    betterstack:
      sourcetoken: ""
      ingestinghost: ""

  lake:
    use: s3                      # s3 | fs (development)
    s3:
      endpoint: https://fsn1.your-objectstorage.com
      region: fsn1
      bucket: my-lake
      accesskey: ${LAKER_S3_ACCESS_KEY}
      secretkey: ${LAKER_S3_SECRET_KEY}
      pathstyle: true
      conditionalput: true       # the bucket refuses to overwrite (If-None-Match: *)
    fs:
      path: ./lake

  # copy of the local state and search index to the lake (_state/, _index/)
  snapshot:
    schedule: "0 30 4 * * *"     # every day at 04:30, or manual

  # listener of laker serve: browser interface, CLI API and agent API
  # (/agent/v1/: each laker-agent waits for approval with `laker agents approve`)
  web:
    enabled: true                # required
    host: 127.0.0.1              # keep it local; expose it only behind a TLS reverse proxy
    port: 8090
    token: ${LAKER_WEB_TOKEN}    # at least 16 characters
    publicurl: ""                # https address behind the proxy, e.g. https://laker.example.com

  # read-only MCP at <publicurl>/mcp for Claude connectors, behind OAuth
  # (each client is approved once with the web token)
  mcp:
    enabled: false
    redirecturis: []             # empty: Claude's callbacks
