name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    needs: [test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Sources: the tag being released (full history for the changelog).
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          path: src
      # Release configuration and LICENSE: the ref this workflow runs from.
      - uses: actions/checkout@v4
        with:
          path: cfg
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: src
          args: release --clean --config ${{ github.workspace }}/cfg/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (Contents read/write on avero-it/homebrew-tap and
          # avero-it/scoop-bucket). Empty if unset: those uploads are skipped.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Absolute: GoReleaser cannot archive files given by a relative "../" path.
          LICENSE_DIR: ${{ github.workspace }}/cfg
