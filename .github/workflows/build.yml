name: Build & Test

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # full history so Go can embed VCS details
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          for arch in amd64 arm64; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o laker-linux-$arch ./cmd/laker
            env CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o laker-agent-linux-$arch ./cmd/laker-agent
          done
          # the agent also runs on the machines that hold the data
          env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o laker-agent-darwin-arm64 ./cmd/laker-agent
          env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o laker-agent-windows-amd64.exe ./cmd/laker-agent

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: laker
          path: |
            laker-linux-*
            laker-agent-*
